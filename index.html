<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2A4B84" />
    <meta name="description" content="The Healing Home Approach - A trauma-informed psychoeducational support tool for foster and adoptive caregivers." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Healing Home" />
    <title>The Healing Home Approach</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Force stale service workers to update. On first visit after deploy,
      // this unregisters old SWs that don't have skipWaiting, reloads once,
      // and the new SW (with skipWaiting+clientsClaim) takes over cleanly.
      (function () {
        var SW_VERSION = '4';
        if (!('serviceWorker' in navigator)) return;
        var stored = localStorage.getItem('sw_version');
        if (stored === SW_VERSION) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (regs.length === 0) {
            localStorage.setItem('sw_version', SW_VERSION);
            return;
          }
          Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
            localStorage.setItem('sw_version', SW_VERSION);
            if (stored !== null) location.reload();
          });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
